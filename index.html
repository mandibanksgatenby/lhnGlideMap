<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Custom 10k CSV Map</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">    
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; height: 100%; }
    </style>
</head>
<body>
<div id="map"></div>
<script>
    mapboxgl.accessToken = 'pk.eyJ1IjoiZ2xpZGVtYXBzIiwiYSI6ImNscTMwbmt3YjBvbnUyanAwbXlsbXk3ZDAifQ.X9_h6bXN4R8G4vEx1XwUXA';

    // PASTE YOUR GENERATED GHOST SHEET CSV LINK INSIDE THE SINGLE QUOTES BELOW:
    const csvUrl = 'https://docs.google.com/spreadsheets/d/1HnJ17ysRN0SZs-JvGtbi7iK0o6dM1fIOv8ua1UfGdsA/export?format=csv';
    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/light-v11',
        center: [0, 0], 
        zoom: 1
        });

        map.on('load', () => {
        Papa.parse(csvUrl, {
            download: true,
            header: true, // Switched back to true to read column headers by name
            skipEmptyLines: true,
            complete: function(results) {
                transformAndLoadData(results.data);
            }
        });
    });

        function transformAndLoadData(rows) {
        const features = rows.map(row => {
            if (!row) return null;

            // Automatically scans your Google Sheet columns by matching header text
            const keys = Object.keys(row);
            
            const titleKey = keys[0];
            const descKey = keys[1];
            const latKey = keys[2];
            const lngKey = keys[3];
            
            const title = row[titleKey] || 'Location';     
            const description = row[descKey] || '';       
            const lat = parseFloat(row[latKey]);         
            const lng = parseFloat(row[lngKey]);         

            if (isNaN(lat) || isNaN(lng)) return null;

            return {
                type: 'Feature',
                geometry: { type: 'Point', coordinates: [lng, lat] },
                properties: { 
                    title: title,
                    description: description
                }
            };
        }).filter(f => f !== null);
        
        const geojsonData = { type: 'FeatureCollection', features: features };

        map.addSource('locations', {
            type: 'geojson',
            data: geojsonData,
            cluster: true,
            clusterMaxZoom: 14,
            clusterRadius: 50
        });

        map.addLayer({
            id: 'clusters',
            type: 'circle',
            source: 'locations',
            filter: ['has', 'point_count'],
            paint: {
                                'circle-color': ['step', ['get', 'point_count'], '#51bbd6', 100, '#f1f075', 750, '#f28cb1'],
                'circle-radius': ['step', ['get', 'point_count'], 20, 100, 30, 750, 40]
            }
        });

        map.addLayer({
            id: 'cluster-count',
            type: 'symbol',
            source: 'locations',
            filter: ['has', 'point_count'],
            layout: {
                'text-field': ['get', 'point_count_abbreviated'],
                'text-font': ['DIN Offc Pro Medium', 'Arial Unicode MS Bold'],
                'text-size': 12
            }
        });

        map.addLayer({
            id: 'unclustered-point',
            type: 'circle',
            source: 'locations',
            filter: ['!', ['has', 'point_count']],
            paint: {
                'circle-color': '#11b4da',
                'circle-radius': 8,
                'circle-stroke-width': 1,
                'circle-stroke-color': '#fff'
            }
        });
    }
</script>
</body>
</html>
